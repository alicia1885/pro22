</section>

];
const EVENT_TYPES=[
 {title:'一顿看似普通的早餐',text:(p,c)=>`你在${p}找到${c.name}。${PLACE_DESC[p]}\n\n${c.name}正在处理早餐，动作熟练得不像第一次来。你随口提到昨晚没睡好，他停了一下，把原本给自己的那杯热饮推到你面前。\n\n“别误会，只是多做了一杯。”\n\n（他把糖罐挪到了更靠近你的方向。）`},

function finishQuiz(){const top=Object.entries(traits).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);state.topTraits=top;show('game');$('#saveBtn').classList.remove('hidden');$('#loadBtn').classList.remove('hidden');intro();saveAuto();}
function intro(){const entrances={early:`你比约定时间早到了四十分钟。于是当五位嘉宾陆续推门时，最先迎接他们的人都是你。`,normal:`你拖着行李按时抵达。客厅里已经坐着三个人，剩下两位正好和你前后脚进门。`,late:`别墅里的人已经等了很久。你推门时，五道视线同时落在你身上。顾言澈看了一眼时间，陆星燃却直接吹了声口哨。`,blind:`正式见面前，节目组先安排了一场蒙眼速配。你记住了一道很好听的声音，却在摘下眼罩后发现自己认错了人。`,mystery:`节目组的车临时抛锚，你和一位身份未知的嘉宾共撑一把伞走到别墅。推门后，你才发现一路上话很少的那个人也在嘉宾名单里。`};
 const first=pick(state.unlocked);mod(first,{aff:state.entrance==='late'&&first==='gu'?-2:5,spark:5,trust:2},false);renderScene('入住日','第一次见面',`${entrances[state.entrance]}\n\n顾言澈坐得笔直，沈知遥几乎不敢看镜头，程野主动接过你的行李，裴景珩打量了你两秒后笑了一下，陆星燃已经开始替节目组预测热搜。\n\n手机在口袋里震动。\n\n【心动配对：欢迎入住。每天拥有三次行动机会，睡前必须发送一条匿名心动短信。】`,[{text:'开始第一天的自由行动',fn:chooseAction}]);}
function renderScene(tag,title,text,opts=[]){state.scene={tag,title,text};$('#sceneTag').textContent=tag;$('#sceneTitle').textContent=title;$('#story').textContent=text;$('#actions').innerHTML='';$('#feedback').textContent='';opts.forEach((o,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=`${String.fromCharCode(65+i)}. ${o.text}`;b.onclick=o.fn;$('#actions').appendChild(b)});renderDash();}
function renderDash(){if(!state)return;$('#dayPill').textContent=`第 ${state.day} / 45 天`;$('#timePill').textContent=state.time;$('#actionPill').textContent=`剩余行动 ${state.actions}`;$('#traitPill').textContent=(state.topTraits||[]).join(' · ')||'人设生成中';$('#publicLike').textContent=state.public.like;$('#controversy').textContent=state.public.controversy;$('#value').textContent=state.public.value;$('#relations').innerHTML='';state.unlocked.forEach(k=>{const c=CAST[k],r=state.rel[k],d=document.createElement('div');d.className='person';d.innerHTML=`<div class="avatar">${c.initial}</div><div><b>${c.name}</b><small>${c.role} · ${cpName(k)}</small></div><span class="stage">${stageOf(r.aff)}</span>`;$('#relations').appendChild(d)});}
function availablePlaces(){const base=['厨房','客厅','花园','露台','影音室','游戏房','健身房','餐厅'];if(state.unlocked.includes('zh'))base.push('走廊');return shuffle(base).slice(0,4);}
function chooseAction(){if(state.day>=45)return finalDay();if(state.actions<=0)return heartMessage();const places=availablePlaces();let opts=places.map(p=>({text:`去${p}`,fn:()=>encounter(p)}));const close=state.unlocked.filter(k=>state.rel[k].aff>=30);if(close.length){opts.push({text:'主动邀请某位熟悉的嘉宾',fn:inviteMenu})}renderScene(`第${state.day}天 · 自由行动`,'你准备去哪里？','前期只能根据嘉宾习惯制造偶遇。关系达到“熟悉”后，才能比较稳定地主动约人。',opts);}
function candidateAt(place){let arr=state.unlocked.filter(k=>CAST[k].places.includes(place));if(!arr.length)arr=state.unlocked;return pick(arr);}
function encounter(place,k=null){k=k||candidateAt(place);const c=CAST[k],r=state.rel[k];r.seen++;const e=EVENT_TYPES[(state.day+r.seen+state.actions+Object.keys(CAST).indexOf(k))%EVENT_TYPES.length];const options=buildOptions(k,e);renderScene(`${place} · ${c.name}`,e.title,e.text(place,c),options);}
function buildOptions(k,e){const c=CAST[k];return [
 {text:'认真回应他的真实情绪',fn:()=>resolve(k,{aff:5,trust:5,spark:2},`${c.name}没有立刻回答，但神情明显柔和了一点。`)},
 {text:'开个暧昧玩笑，把距离拉近',fn:()=>resolve(k,{aff:3,spark:7,jealous:2,trust:-1},`${c.name}${c.style}，没有接话，也没有躲开。`)},
 {text:'保持清醒，先确认他的边界',fn:()=>resolve(k,{trust:6,respect:5,spark:1},`你没有贸然推进。${c.name}看你的目光比刚才认真了。`)},
 {text:'说一个方便脱身的小谎',fn:()=>lieResolve(k)}
 ];}
function resolve(k,eff,text){const before=stageOf(state.rel[k].aff);mod(k,eff,true);state.actions--;state.time=state.actions===2?'下午':state.actions===1?'晚上':'睡前';const after=stageOf(state.rel[k].aff);const cross=before!==after?`\n\n【关系阶段变化：${CAST[k].name} · ${before} → ${after}】`:'';renderScene('行动结果',CAST[k].name,text+cross,[{text:state.actions?'继续今天的行动':'进入睡前短信',fn:state.actions?chooseAction:heartMessage}]);saveAuto();}
function lieResolve(k){const r=state.rel[k],skill=state.traits.心机-state.traits.坦诚+Math.random()*4;let eff,text;if(skill>1){eff={aff:2,spark:3,lies:1};text=`这个谎暂时替你避开了尴尬。${CAST[k].name}似乎相信了，但你不知道它会不会在节目回放里留下痕迹。`;}else{eff={aff:-2,trust:-6,disappoint:4,lies:1};text=`${CAST[k].name}看着你，没有拆穿。那段沉默比追问更让人不安。`;}resolve(k,eff,text);}
function mod(k,e,notice=true){const r=state.rel[k];for(const [x,v] of Object.entries(e)){if(x in r)r[x]=clamp(r[x]+v)};if(e.aff>0&&r.aff>70)r.aff-=Math.ceil(e.aff/2);if(notice){const score=(e.aff||0)+(e.trust||0)+(e.spark||0)-(e.disappoint||0);const f=$('#feedback');f.textContent=score>6?'他似乎更在意你了。':score<-3?'气氛出现了不易忽略的裂缝。':'他的情绪发生了一点变化。';f.className='feedback '+(score>6?'good':score<-3?'bad':'');}}
function inviteMenu(){const opts=state.unlocked.filter(k=>state.rel[k].aff>=30).map(k=>({text:`邀请${CAST[k].name}`,fn:()=>{const r=state.rel[k];if(r.disappoint>55||Math.random()<.08){renderScene('邀请结果','他没有答应',`${CAST[k].name}回复：“今天不太合适。”\n\n关系再好，也不代表对方永远随叫随到。`,[{text:'换个行动',fn:chooseAction}]);}else encounter(pick(CAST[k].places),k)}}));opts.push({text:'返回地点选择',fn:chooseAction});renderScene('手机消息','主动邀请','你点开了已经能够直接联系的嘉宾列表。',opts);}
function heartMessage(){const opts=state.unlocked.map(k=>({text:`发给${CAST[k].name}`,fn:()=>sendHeart(k)}));opts.push({text:'今晚谁也不发（违反任务）',fn:()=>sendHeart(null)});renderScene(`第${state.day}天 · 睡前`,'匿名心动短信','短信只显示内容，不显示发送人。你无法确定今晚收到的每一句话来自谁。',opts);}
function sendHeart(k){let text;if(k){mod(k,{aff:3,spark:4,jealous:-1},false);text=`你写下：“今天和你相处的那一刻，我没有在想镜头。”\n\n发送成功。几分钟后，你收到${Math.max(1,Math.floor(state.unlocked.length/2))}条匿名短信。\n\n“你对所有人都这么好吗？”\n“明天别再让我等太久。”\n“晚安。这个不是群发。”`;}else{state.public.controversy=clamp(state.public.controversy+4);text=`你没有发送短信。零点后，软件弹出红色提示。\n\n【任务失败。节目组将在下一期公开你放弃选择。】`;}
 endDay(text);}
function endDay(text){state.history.push({day:state.day,top:topPerson()});const next=()=>{state.day++;state.actions=3;state.time='上午';unlockCheck();if(state.day>=45)finalDay();else if([5,9,13,17,21,25,29,33,37,41,44].includes(state.day))specialDay();else if((state.day-1)%4===0)episode();else chooseAction();saveAuto();};renderScene('夜晚结算',`第${state.day}天结束`,text,[{text:'进入第二天',fn:next}]);}
function topPerson(){return state.unlocked.sort((a,b)=>state.rel[b].aff-state.rel[a].aff)[0];}
function unlockCheck(){if(!state.hidden.director&&state.day>=18&&(state.public.controversy>=25||state.day>=23||state.traits.勇敢>=6)){state.hidden.director=1;state.unlocked.push('zh');state.rel.zh.aff=16;state.rel.zh.trust=24;state.pendingUnlock='zh'}if(!state.hidden.friend&&state.day>=25&&(state.rel[topPerson()].aff>=45||state.day>=31)){state.hidden.friend=1;state.unlocked.push('xu');state.rel.xu.aff=28;state.rel.xu.trust=48;state.pendingUnlock='xu'}}
function specialDay(){if(state.pendingUnlock){const k=state.pendingUnlock;state.pendingUnlock=null;const txt=k==='zh'?`一次恶意剪辑引发争议。总导演周叙白当众要求停机，并第一次走进镜头。\n\n“从现在起，我退出这一期的剪辑决策。”他看向你，“如果节目需要一个补位嘉宾，我来。”\n\n客厅里安静得只剩设备运行声。`:`节目组安排亲友观察团。许闻川坐在监视器前看完你和别人约会的片段，当晚直接出现在别墅门口。\n\n“我不是来参加相亲的。”\n\n十分钟后，他已经坐在你旁边，开始询问每位嘉宾的感情史。`;renderScene('隐藏嘉宾登场',CAST[k].name,txt,[{text:'继续面对新的修罗场',fn:()=>{state.actions=2;chooseAction()}}]);return}
 const specials=[['双人真心话','节目组抽签决定双人搭档。问题从“理想型”一路问到“是否接受恋人同时爱上别人”。'],['交换房间夜','所有人必须重新选择房间。最受欢迎的房间，恰好在你的隔壁。'],['匿名约会竞拍','每位嘉宾用一件私人物品竞拍与你约会的资格，你只能选一件。'],['公开心动排名','节目组要求每个人排出当前最心动的三人。客厅里的空气从未如此安静。'],['海边集体旅行','节目组把所有人送到海边民宿。座位、房间和双人任务都在制造新的阵营。']];const [title,text]=specials[state.day%specials.length];const keys=shuffle(state.unlocked).slice(0,3);renderScene(`特别活动日 · 第${state.day}天`,title,text,keys.map(k=>({text:`优先靠近${CAST[k].name}`,fn:()=>{mod(k,{aff:7,trust:4,spark:5},false);state.unlocked.filter(x=>x!==k).forEach(x=>mod(x,{jealous:4},false));state.actions=0;renderScene('特别活动结果',CAST[k].name,`${CAST[k].name}没有掩饰被选择后的高兴。\n\n（另外几个人的反应各不相同，有人沉默，有人笑着起哄，也有人提前离开了镜头。）`,[{text:'发送今晚的心动短信',fn:heartMessage}])}})) );}
function episode(){state.episodes++;const top=topPerson(),cp=cpName(top);const negative=state.public.controversy>35;const comments=negative?[`“${state.name}到底是真心还是在养鱼？”`,`“剪辑太刻意了，完整对话呢？”`,`“${CAST[top].name}看他的眼神根本藏不住。”`]:[`“${cp}今天也太好磕了吧！”`,`“主角记得每个人的小事，这谁顶得住。”`,`“有人注意到旁边那位的表情吗？醋坛子翻了。”`];const text=`第${state.episodes}期节目上线。你亲历的几天被压缩成九十分钟，有些温柔被保留，有些沉默被剪成了冷漠。\n\n【热搜：#${cp}氛围感#】\n\n${comments.map(x=>'• '+x).join('\n')}\n\n节目组询问你是否要回应争议。`;renderScene('节目播出',`第${state.episodes}期评论区`,text,[
 {text:'坦诚解释完整经过',fn:()=>media({like:5,controversy:-4,value:2},'你的回应不算完美，但不少观众愿意重新看待那段剪辑。')},
 {text:'用幽默化解，不正面站队',fn:()=>media({like:3,controversy:2,value:5},'回应迅速出圈，笑的人很多，仍有人质疑你回避重点。')},
 {text:'保留证据，暂时沉默',fn:()=>media({like:-1,controversy:3,value:1},'沉默让争议继续发酵，也给你留下了之后反转的空间。')},
 {text:'直接硬刚节目组',fn:()=>media({like:6,controversy:8,value:4},'你赢得一批支持者，也把矛盾推上了更大的热搜。')}
 ]);}
function media(e,text){for(const [k,v] of Object.entries(e))state.public[k]=clamp(state.public[k]+v);$('#hotTopic').textContent=`当前热门：${cpName(topPerson())} · 争议 ${state.public.controversy}`;state.actions=2;renderScene('舆论反馈','回应之后',text,[{text:'回到合宿生活',fn:chooseAction}]);saveAuto();}
function finalDay(){if(state.ended)return;state.ended=1;const confess=state.unlocked.filter(k=>state.rel[k].aff>=35||k===topPerson());const lines=confess.map(k=>`${CAST[k].name}：${state.rel[k].trust<25?'“我喜欢你，但我不知道还能不能相信你的答案。”':CAST[k].line}`).join('\n\n');renderScene('第45天 · 最终告白','所有人的答案',`${lines}\n\n告白结束后，节目组把最后的选择交给你。你可以接受一人、多人、全部，也可以暂时不选择任何人。`,[{text:'做出最终选择',fn:()=>endingSelect(confess)}]);}
function endingSelect(list){const d=$('#endingDialog'),body=$('#endingBody');$('#endingTitle').textContent='请选择接受的人';body.innerHTML=`<p>多人结局始终是1vN。嘉宾之间不会恋爱，但会继续吃醋，也需要协商边界。</p><div class="checklist">${list.map(k=>`<label class="check"><input type="checkbox" value="${k}"> <b>${CAST[k].name}</b> <span>· ${stageOf(state.rel[k].aff)}</span></label>`).join('')}</div><button class="btn primary" id="confirmEnding">确认选择</button> <button class="btn" id="singleEnding">谁都不选</button>`;d.showModal();$('#confirmEnding').onclick=()=>showEpilogue([...body.querySelectorAll('input:checked')].map(x=>x.value));$('#singleEnding').onclick=()=>showEpilogue([]);}
function showEpilogue(chosen){const body=$('#endingBody');let text;if(!chosen.length){text=`节目结束一年后，${state.name}没有急着进入任何关系。那45天仍让你学会了区分心动、依赖和真正的选择。\n\n有人已经放下，有人偶尔还会在凌晨给你发一句“最近好吗”。`;}
 else if(chosen.length===1){const c=CAST[chosen[0]];text=`一年后，你和${c.name}仍在一起。镜头外的恋爱没有任务卡和热搜，争吵也不会自动剪成浪漫片段。\n\n你们终于学会在没有观众的时候，仍然认真回答彼此。\n\n${c.name}${c.style}，把手伸向你：“回家了。”`;}
 else{const names=chosen.map(k=>CAST[k].name);text=`一年后，你和${names.join('、')}维持着公开、知情的多人关系。\n\n顾言澈式的日程表、程野式的临时截胡、裴景珩式的突然旅行、陆星燃式的全程起哄，以及每个人完全不同的吃醋方式，让同居生活从未真正安静。\n\n他们彼此没有爱情，所有人的选择中心仍然是你。能走到今天，不是因为没人嫉妒，而是因为你们终于愿意把嫉妒说出来。`;}
 const un=state.unlocked.filter(k=>!chosen.includes(k)).map(k=>CAST[k].name);body.innerHTML=`<div class="ending"><p>${text.replaceAll('\n','<br>')}</p><div class="hint">最终伴侣：${chosen.length?chosen.map(k=>CAST[k].name).join('、'):'无'}<br>伴侣人数：${chosen.length}<br>未选择嘉宾：${un.join('、')||'无'}<br>节目口碑：${state.public.like>=65?'口碑逆转':state.public.controversy>=60?'全网修罗场':'争议中走红'}</div><button class="btn primary" id="again">重新开始一局</button></div>`;$('#again').onclick=()=>{localStorage.removeItem('heart_auto');location.reload()};}
function saveAuto(){if(state)localStorage.setItem('heart_auto',JSON.stringify(state));}
function saveModal(loadOnly=false){const d=$('#saveDialog'),box=$('#saveSlots');box.innerHTML='';for(let i=1;i<=5;i++){const raw=localStorage.getItem('heart_slot_'+i),s=raw?JSON.parse(raw):null;const row=document.createElement('div');row.className='save-row';row.innerHTML=`<span>存档 ${i}：${s?`${s.name} · 第${s.day}天 · ${s.time}`:'空'}</span><button class="btn" data-save="${i}">保存</button><button class="btn" data-load="${i}" ${s?'':'disabled'}>读取</button>`;if(loadOnly)row.querySelector('[data-save]').classList.add('hidden');box.appendChild(row)}box.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{localStorage.setItem('heart_slot_'+b.dataset.save,JSON.stringify(state));saveModal(loadOnly)});box.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{const raw=localStorage.getItem('heart_slot_'+b.dataset.load);if(raw){state=JSON.parse(raw);traits=state.traits;d.close();show('game');$('#saveBtn').classList.remove('hidden');$('#loadBtn').classList.remove('hidden');renderScene(state.scene?.tag||'读档成功',state.scene?.title||'欢迎回来',state.scene?.text||'你重新回到了合宿别墅。',[{text:'继续游戏',fn:state.actions?chooseAction:heartMessage}]);}});d.showModal();}
$('#startBtn').onclick=start;$('#nameInput').addEventListener('keydown',e=>{if(e.key==='Enter')start()});$('#saveBtn').onclick=()=>saveModal(false);$('#loadBtn').onclick=()=>saveModal(true);$('#restartBtn').onclick=()=>{if(confirm('确定重新开始？手动存档不会被删除。')){localStorage.removeItem('heart_auto');location.reload()}};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).close());
const auto=localStorage.getItem('heart_auto');if(auto){const s=JSON.parse(auto);const btn=document.createElement('button');btn.className='btn';btn.textContent=`继续：${s.name} 第${s.day}天`;btn.onclick=()=>{state=s;traits=state.traits;show('game');$('#saveBtn').classList.remove('hidden');$('#loadBtn').classList.remove('hidden');renderScene(state.scene?.tag||'继续游戏',state.scene?.title||'欢迎回来',state.scene?.text||'你回到了合宿别墅。',[{text:'继续',fn:state.actions?chooseAction:heartMessage}])};$('#welcome').appendChild(btn)}
})();
</script>
</body>
